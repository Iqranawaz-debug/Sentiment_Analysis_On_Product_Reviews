paths:
  data:
  - data/raw/Amazon_Food_Reviews.csv
  - data/raw/Datafiniti_Amazon_Consumer_Reviews_of_Amazon_Products_May19.csv
  models: models/reproduction
  reports: reports/reproduction
seed: 42
split:
  train: 0.7
  val: 0.15
  test: 0.15
calibration_fraction: 0.2
cv_folds: 5
n_jobs: 1
low_confidence_threshold: 0.6
features:
  min_df: 2
  max_features: 50000
  char_max_features: 50000
model_grids:
  logistic:
  - 0.5
  - 1.0
  - 2.0
  linear_svc:
  - 0.5
  - 1.0
  - 2.0
transformer:
  model: distilbert-base-uncased
  max_samples: 3000
  epochs: 2
  batch_size: 8
  max_length: 128
